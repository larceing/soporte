# Solo en producción (lo monta docker-compose.server.yml).

# Sin versión de Apache ni del sistema en cabeceras y páginas de error.
ServerTokens Prod
ServerSignature Off

# El proxy termina el HTTPS; MantisBT necesita saberlo para marcar las
# cookies como seguras.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# El instalador y las herramientas de administración solo responden desde
# dentro del propio contenedor (instalación y actualizaciones por consola).
<Directory /var/www/html/admin>
    Require local
</Directory>
