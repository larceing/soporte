# MantisBT y la base de datos en el servidor, una instalación por entorno.
#
# El portal no sale de aquí: lo despliega el servidor DEV/PRO desde la imagen
# ghcr.io/larceing/soporte (servidor.json) como contenedor soporte-<entorno>,
# que solo está en la red del proxy. Por eso MantisBT y la base de datos están
# también en esa red: el portal llega a ellos por su nombre de contenedor.
#
# NOMBRE (en .env) distingue las instalaciones: incidencias (PRO) e
# incidencias-dev (DEV). Sin puertos publicados.
#
# Los servicios se llaman «mantis» y «bd», no <NOMBRE>-mantis ni <NOMBRE>-db:
# Docker da a cada contenedor el nombre de su servicio en todas sus redes, y DEV
# y PRO comparten proxy_default. Si el servicio se llamara como el contenedor de
# PRO, «incidencias-db» apuntaría también a la base de datos de DEV. Nadie debe
# usar «mantis» ni «bd» desde fuera: solo los nombres de contenedor.
name: ${NOMBRE:-incidencias}

services:
  mantis:
    image: ${NOMBRE:-incidencias}-mantis:latest
    build: ./docker/web
    container_name: ${NOMBRE:-incidencias}-mantis
    restart: unless-stopped
    volumes:
      - ./config:/var/www/html/config
      - ./plugins/HenryArce:/var/www/html/plugins/HenryArce
      - ./scripts:/var/www/scripts:ro
      - ./docker/web/produccion.conf:/etc/apache2/conf-enabled/zz-produccion.conf:ro
    depends_on:
      bd:
        condition: service_healthy
    networks:
      - internal
      - proxy_default

  bd:
    image: mariadb:11.4
    container_name: ${NOMBRE:-incidencias}-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - incidencias-db-data:/var/lib/mysql
    networks:
      - internal
      - proxy_default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  incidencias-db-data:

networks:
  internal:
  proxy_default:
    external: true
